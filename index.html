<html lang="ko">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

/* VOICE: 촬영 현장 콘티 시트처럼 담백하고 정확하게

:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121316);--ink:light-dark(#121316,#eceef2);--sub:light-dark(#5d616b,#a3a8b3);--line:light-dark(#e3e5ea,#2a2d33);--card:light-dark(#f4f5f8,#1a1c20);--rec:#e5322d}

*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3.5vw,48px) max(4vw,16px)}
.wrap{max-width:1320px;margin:0 auto}

h1 i{font-style:normal;display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--rec);margin-right:.25em;vertical-align:.12em}
.lead{margin:0;color:var(--sub);max-width:64ch}

.left{display:flex;flex-direction:column;gap:12px}

.vc{display:flex;flex-direction:column;gap:10px}
.view{background:#dcdde2;border-radius:14px;overflow:hidden;display:flex;justify-content:center}
.view canvas{display:block;width:100%;height:auto;max-height:74vh;object-fit:contain}
body[data-ar="916"] .view canvas{width:auto;max-width:100%}
#strip{display:block;width:100%;height:auto;border-radius:10px;background:var(--card)}
#strip[hidden]{display:none}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.map{margin:0;background:var(--card);border-radius:14px;padding:10px 10px 6px}
.map figcaption{font-size:13px;line-height:1.35;color:var(--sub);margin-bottom:4px}.map figcaption b{color:var(--ink);font-size:16px;margin-right:6px}

.map .h{cursor:grab}.map .h:active{cursor:grabbing}
.ink{stroke:var(--ink);fill:none}.fink{fill:var(--ink)}.sub{fill:var(--sub);font:12px "Noto Sans KR",sans-serif}.ring{stroke:var(--line);fill:none}

.view{position:relative}.view canvas{cursor:grab;touch-action:none}.view canvas:active{cursor:grabbing}
.lensbar{display:flex;align-items:center;gap:12px}.lensbar span{font-size:14px;color:var(--sub);flex:none}.lensbar input{flex:1;accent-color:var(--rec);height:32px}.lensbar b{flex:none;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--sub);margin:-4px 0 0}
.out{display:flex;flex-direction:column;gap:10px}
.badge{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--rec);border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:2px}
.badge[hidden]{display:none}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.bar span{font-size:14px;color:var(--sub);margin-right:6px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:500 15px/1 inherit;font-family:inherit;color:var(--ink);background:transparent;border:0;min-height:40px;padding:0 14px;cursor:pointer}

.sum{font-weight:700;font-size:18px;margin:0}

.chip[aria-pressed=true]{border-color:var(--rec)}
.chip[aria-pressed=true] small{color:var(--rec)}
.note{font-size:14px;color:var(--sub);margin:0}
@media(max-width:900px){.stage{grid-template-columns:1fr}}@media(max-width:520px){.maps{grid-template-columns:1fr}}
</style>
</head>
